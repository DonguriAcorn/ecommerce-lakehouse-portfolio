# 接続設定。dbt_project.yml の profile: と同じ名前を先頭に置く
ecom_lakehouse:
  target: dev                              # 何も指定しないとき使う接続先
  outputs:
    dev:
      type: athena                         # 接続先は Athena
      region_name: ap-northeast-1          # 東京リージョン
      work_group: ecom-dev                 # 1 GiB 上限のある workgroup
      database: awsdatacatalog             # Glue Data Catalog の既定名(Athena 側の「カタログ」)
      schema: ecom_dev_silver              # モデルを作る Glue DB(Silver)
      s3_staging_dir: "s3://{{ env_var('LAKE_BUCKET') }}/athena-results/"   # クエリ結果の一時置き場
      s3_data_dir: "s3://{{ env_var('LAKE_BUCKET') }}/iceberg/"             # テーブルの実体の置き場(iceberg/ に固定)
      aws_profile_name: ecom-dev-transform # 使う AWS プロファイル
      threads: 4                           # 同時に流すクエリの数
    prod:                                  # `--target prod` で選ぶ。名前は Gold の置き場(ecom_prod_gold)も決める
      type: athena                         # 接続先は Athena
      region_name: ap-northeast-1          # 東京リージョン
      work_group: ecom-prod                # prod 用の workgroup(1 GiB 上限)
      database: awsdatacatalog             # Glue Data Catalog の既定名
      schema: ecom_prod_silver             # モデルを作る Glue DB(Silver、prod)
      s3_staging_dir: "s3://{{ env_var('LAKE_BUCKET') }}/athena-results/"   # prod で流すときは LAKE_BUCKET を prod のバケットにする
      s3_data_dir: "s3://{{ env_var('LAKE_BUCKET') }}/iceberg/"             # テーブルの実体の置き場
      aws_profile_name: ecom-prod-transform # prod の transform ロール(dev のロールでは書けない)
      threads: 4                           # 同時に流すクエリの数
    ci:                                    # PR チェック用(`--target ci`)。Gold の置き場は ecom_ci_gold になる
      type: athena                         # 接続先は Athena
      region_name: ap-northeast-1          # 東京リージョン
      work_group: ecom-ci                  # CI 専用の workgroup(1 GiB 上限)
      database: awsdatacatalog             # Glue Data Catalog の既定名
      schema: ecom_ci_silver               # 練習用の Silver(ecom-ci-dbt が書ける Glue DB)
      s3_staging_dir: "s3://{{ env_var('LAKE_BUCKET') }}/athena-results/ci/"   # クエリ結果は ci/ の下だけ(LAKE_BUCKET は dev のバケット)
      s3_data_dir: "s3://{{ env_var('LAKE_BUCKET') }}/iceberg/ci/"             # テーブルの実体は iceberg/ci/ の下だけ
      threads: 4                           # 同時に流すクエリの数
      # aws_profile_name は書かない。CI ではロールを借りた一時キーが環境変数に入っていて、それが使われる
