# fact_order_items の荷札(meta / tags)、説明(セマンティックレイヤー Lv1)、品質検査(data_tests)
version: 2

models:
  - name: fact_order_items
    description: "注文明細の事実テーブル。1行 = 注文の中の1商品(112,650 行)。商品別・カテゴリ別の売上は、この表で集計する"
    meta:
      owner: data-eng
      update_frequency: daily
    config:
      tags: [gold, fact]
      contract:
        enforced: true                     # 列の名前・順番・型が SQL の結果と違えば、表を作る前に止める
    data_tests:                              # 表全体にかける条件
      - unique_combination:                  # 自作のテスト(tests/generic/unique_combination.sql)
          arguments:
            columns: ["order_id", "order_item_id"]   # この2列の組が重複しない
    columns:
      - name: order_id
        data_type: varchar
        description: "注文の ID。order_item_id と合わせて主キー"
        data_tests: [not_null]
      - name: order_item_id
        data_type: integer
        description: "注文の中の明細の番号。order_id と合わせて主キー"
        data_tests: [not_null]
      - name: product_id
        data_type: varchar
        description: "商品の ID。dim_product とつなぐ"
        data_tests:
          - relationships:                   # この商品は、必ず dim_product にある
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: seller_id
        data_type: varchar
        description: "出品者の ID。キーとして持つだけ(出品者の表は作らない)"
      - name: customer_sk
        data_type: varchar
        description: "注文の時点の顧客の行。dim_customer とつなぐ"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_sk
      - name: purchase_date
        data_type: date
        description: "購入日。dim_date とつなぐ"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: order_status
        data_type: varchar
        description: "注文の状態"
      - name: is_counted
        data_type: boolean
        description: "売上に数えるか。canceled と unavailable は false。売上の集計は true の行だけにする"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: price
        data_type: decimal(10,2)
        description: "商品代金"
      - name: freight_value
        data_type: decimal(10,2)
        description: "送料"
      - name: item_amount
        data_type: decimal(11,2)
        description: "明細の売上(商品代金 + 送料)。{{ doc('gmv') }}"
