# pub_category_monthly の荷札(meta / tags)、説明、品質検査
version: 2

models:
  - name: pub_category_monthly
    description: "公開用(ADR 0018)。1行 = 月 × カテゴリ。売上、販売数、平均の星。is_counted が true の明細だけを数える"
    meta:
      owner: data-eng
      update_frequency: daily
    config:
      tags: [gold, pub]                      # 公開用のシール
      contract:
        enforced: true                     # 列の名前・順番・型が違えば止める
    data_tests:
      - unique_combination:                  # 月 × カテゴリの組が重複しない
          arguments:
            columns: ["year_month", "category_name"]
    columns:
      - name: year_month
        data_type: varchar
        description: "購入した月(YYYY-MM)"
        data_tests: [not_null]
      - name: category_name
        data_type: varchar
        description: "カテゴリ名(英訳 → 元の名前 → unknown)"
        data_tests: [not_null]
      - name: gmv
        data_type: decimal(38,2)
        description: "売上(明細の商品代金 + 送料の合計)。{{ doc('gmv') }}"
        data_tests: [not_null]
      - name: items_sold
        data_type: bigint
        description: "販売数(明細の数)"
        data_tests: [not_null]
      - name: avg_review_score
        data_type: double
        description: "平均の星(1〜5)。明細ごとに、その注文の星を数える。レビューのない注文は数えない。全部ない組は空"
      - name: review_score_sum
        data_type: bigint
        description: "星の合計(明細ごとに、その注文の星を足す)。平均の星を月やカテゴリをまたいで出すときは sum(review_score_sum) / sum(reviewed_items)"
        data_tests: [not_null]
      - name: reviewed_items
        data_type: bigint
        description: "星のある明細の数(review_score_sum の分母)"
        data_tests: [not_null]
