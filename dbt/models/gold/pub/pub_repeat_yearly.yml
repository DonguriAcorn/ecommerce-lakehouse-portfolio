# pub_repeat_yearly の荷札(meta / tags)、説明、品質検査
version: 2

models:
  - name: pub_repeat_yearly
    description: "公開用(ADR 0018 の追加)。1行 = 年 × 州。買った本人の数と、そのうち全期間で2注文以上の本人の数。月別の人数は足しても年別にならないため、年で数え直した。リピート率はアプリが repeat_buyers / buyers で出す。{{ doc('repeat_rate') }}"
    meta:
      owner: data-eng
      update_frequency: daily
    config:
      tags: [gold, pub]                      # 公開用のシール
      contract:
        enforced: true                     # 列の名前・順番・型が違えば止める(本人の ID が混ざる事故を防ぐ)
    data_tests:
      - unique_combination:                  # 年 × 州の組が重複しない
          arguments:
            columns: ["year", "customer_state"]
    columns:
      - name: year
        data_type: varchar
        description: "購入した年(YYYY)"
        data_tests: [not_null]
      - name: customer_state
        data_type: varchar
        description: "購入した時点の顧客の州"
        data_tests: [not_null]
      - name: buyers
        data_type: bigint
        description: "その年に注文した本人の数(状態を問わない。年の中で何回買っても1人)"
        data_tests: [not_null]
      - name: repeat_buyers
        data_type: bigint
        description: "buyers のうち、全期間で2注文以上の本人の数"
        data_tests: [not_null]
