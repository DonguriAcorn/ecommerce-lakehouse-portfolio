# customers の列の説明と、dbt tests
version: 2                                  # YAML の書式の版。2 で固定

models:
  - name: customers                         # customers.sql のモデルを指す
    description: "顧客マスタ(1行 = 注文ごとの顧客 ID)。同じ人でも注文ごとに customer_id が変わる。"
    columns:
      - name: customer_id
        description: "注文ごとの顧客 ID。主キー(orders_from_events とつなぐ)"
        data_tests:
          - unique                          # 重複がない
          - not_null
      - name: customer_unique_id
        description: "本人の ID。同じ人の注文をまとめる(リピートの判定)のに使う"
        data_tests:
          - not_null
      - name: customer_zip_code_prefix
        description: "郵便番号の先頭5桁(先頭の 0 を保つため文字列)。個人情報の候補"
      - name: customer_city
        description: "市の名前。個人情報の候補"
      - name: customer_state
        description: "州の略号(例: SP)"
      - name: _last_ingest_date
        description: "この行が届いた日(マスタなので 2016-09-04)。古い情報で上書きしないガードに使う"
        data_tests:
          - not_null
      - name: _ingested_at
        description: "監査: この行を Raw に取り込んだ時刻(UTC)"
        data_tests:
          - not_null
      - name: _source_file
        description: "監査: この行の Raw のファイル名"
        data_tests:
          - not_null
      - name: _batch_id
        description: "監査: この行を取り込んだ実行の ID"
        data_tests:
          - not_null
