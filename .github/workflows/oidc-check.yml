# OIDC の通り道の確認用(ADR 0017)。PR チェックのワークフローができたら消す
name: oidc-check

# 動くきっかけ(2つ)
on:
  pull_request:       # PR を出したとき・更新したとき → sub は pull_request なので、借りられるはず
  workflow_dispatch:  # 画面から手動で動かしたとき → sub は ref:refs/heads/main なので、拒否されるはず

# このワークフローに許す GitHub 側の権限
permissions:
  id-token: write  # GitHub に OIDC の証明書(トークン)を発行させる。これがないと借りられない
  contents: read   # リポジトリは読むだけ

jobs:
  assume-plan-role:
    runs-on: ubuntu-latest  # GitHub が用意する使い捨ての Linux マシンで動かす
    steps:
      # 証明書を AWS に渡して、ecom-ci-plan の一時キー(1時間)を受け取る
      - name: ecom-ci-plan を借りる
        uses: aws-actions/configure-aws-credentials@v5
        with:
          # アカウント ID はシークレットから入れる(ファイルに書かない。ログでは *** になる)
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecom-ci-plan
          aws-region: ap-northeast-1
          mask-aws-account-id: true  # 念のため、アカウント ID をログで塗りつぶす

      # 借りたロールの名前だけを表示する(ARN 全体はアカウント ID を含むので出さない)
      - name: 借りたロールの名前を表示する
        run: aws sts get-caller-identity --query Arn --output text | cut -d/ -f2

  # ecom-ci-dbt も、PR のジョブから借りられることを確かめる(借りて名前を表示するだけ。dbt や AWS のデータには触らない)
  assume-dbt-role:
    runs-on: ubuntu-latest
    steps:
      - name: ecom-ci-dbt を借りる
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecom-ci-dbt
          aws-region: ap-northeast-1
          mask-aws-account-id: true

      - name: 借りたロールの名前を表示する
        run: aws sts get-caller-identity --query Arn --output text | cut -d/ -f2

  # ---- ここから prod 用(ADR 0017)。承認を通したジョブだけが借りられることを確かめる ----
  # 手動実行のときだけ動かす(PR では動かさない。PR の sub は pull_request で、prod のロールは借りられない)
  # 動かす枝で結果が変わる:
  #   main 以外の枝 → GitHub の Environments の「デプロイできる枝」で止まる(ジョブが始まらない)
  #   main → 承認画面が出る。承認すると、下の2つを借りられるはず
  assume-prod-deployer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod  # これで sub が environment:prod になる。Required reviewers の承認を待つ
    steps:
      - name: ecom-prod-deployer を借りる
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecom-prod-deployer
          aws-region: ap-northeast-1
          mask-aws-account-id: true

      - name: 借りたロールの名前を表示する
        run: aws sts get-caller-identity --query Arn --output text | cut -d/ -f2

  assume-prod-transform:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: ecom-prod-transform を借りる
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecom-prod-transform
          aws-region: ap-northeast-1
          mask-aws-account-id: true

      - name: 借りたロールの名前を表示する
        run: aws sts get-caller-identity --query Arn --output text | cut -d/ -f2
